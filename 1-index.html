<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instinct Dashboard</title>
<script>
/* Fatal-error trap: runs before any external asset, works even if CSS/JS fail.
   Captures JS errors AND failed resource loads (script/link) in capture phase. */
window.__dashErrors = [];
window.__dashFatal = function (msg) {
  window.__dashErrors.push(msg);
  var box = document.getElementById('fatal-error');
  if (!box) {
    box = document.createElement('div');
    box.id = 'fatal-error';
    box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;' +
      'background:#2a1414;color:#ffb4b4;border:1px solid #7f2d2d;border-radius:8px;' +
      'padding:10px 14px;font:14px/1.45 system-ui,-apple-system,sans-serif;';
    (document.body || document.documentElement).appendChild(box);
  }
  box.textContent = 'Dashboard load problem: ' + msg + ' - try reloading. If this keeps showing, tell Instinct this exact text.';
};
window.addEventListener('error', function (e) {
  if (e && e.message) { window.__dashFatal(e.message); return; }
  var t = e && e.target;
  if (t && (t.src || t.href)) window.__dashFatal('failed to load ' + (t.src || t.href));
}, true);
</script>
<link rel="stylesheet" href="styles.css?v=12">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js?v=12"></script>
<script src="auth_client.js?v=12"></script>
<script src="app.js?v=12" defer></script>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <h1>Instinct Dashboard</h1>
    <p class="muted">Private. Sign in with the authorized Google account.</p>
    <div id="signin-btn"></div>
    <p id="gate-error" class="error" hidden></p>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">Instinct <span>Dashboard</span></div>
    <div class="top-right">
      <span class="live-wrap"><span id="live-dot" class="live-dot"></span><span id="last-sync" class="muted small"></span></span>
      <button id="refresh-now" class="btn ghost">Refresh</button>
      <span id="who" class="muted small"></span>
      <button id="signout" class="btn ghost">Sign out</button>
    </div>
  </header>
  <div id="app-error" class="error banner" hidden></div>

  <section id="now-section">
    <h2 class="now-title">Happening now</h2>
    <div id="now"></div>
  </section>

  <nav id="projects" class="project-nav" aria-label="Projects"></nav>

  <main class="main">
    <div id="project-head"></div>
    <section id="open-section">
      <h3 class="section-title" id="open-title">Open</h3>
      <div id="tasks-open"></div>
    </section>
    <section id="done-section">
      <h3 class="section-title done-toggle" id="done-title"></h3>
      <div id="tasks-done"></div>
    </section>
    <section id="log-section">
      <h3 class="section-title">Activity &amp; fix log</h3>
      <div id="log-filters" class="log-filters"></div>
      <div id="logs"></div>
    </section>
    <section id="gallery-section">
      <h3 class="section-title">Images &amp; screenshots</h3>
      <div id="gallery"></div>
    </section>
    <section id="files-section">
      <h3 class="section-title">Files</h3>
      <div id="files"></div>
    </section>
  </main>
</div>
<script>
/* Boot watchdog: if nothing usable appears within 45s, say so in plain text. */
setTimeout(function () {
  var app = document.getElementById('app');
  var appShown = app && !app.hidden;
  var hasBtn = !!document.querySelector('#signin-btn iframe, #signin-btn div[role="button"]');
  var gateErr = document.getElementById('gate-error');
  var gateErrShown = gateErr && !gateErr.hidden && gateErr.textContent;
  if (!appShown && !hasBtn && !gateErrShown) {
    window.__dashFatal('page did not finish loading within 45 seconds' +
      (window.__dashErrors.length ? '' : ' (no script errors captured - likely a blocked or stuck network request)'));
  }
}, 45000);
</script>
</body>
</html>
